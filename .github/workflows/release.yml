name: Build and release TV APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: mortal-tv-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android platform
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Restore release signing key
        env:
          KEYSTORE: ${{ secrets.SIGNING_STORE_BASE64 }}
        run: |
          test -n "$KEYSTORE" || { echo 'Configure signing secrets before publishing'; exit 1; }
          printf '%s' "$KEYSTORE" | base64 --decode > "$RUNNER_TEMP/release.jks"
      - name: Build and verify
        env:
          SIGNING_STORE: ${{ runner.temp }}/release.jks
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
          SIGNING_ALIAS: ${{ secrets.SIGNING_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest lintDebug assembleRelease -PversionCode=$((1000 + GITHUB_RUN_NUMBER)) -PversionName="1.0.${GITHUB_RUN_NUMBER}"
      - name: Create release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk mortal-tv.apk
          python3 - <<'PY'
          import hashlib,json,os
          run=int(os.environ['GITHUB_RUN_NUMBER'])
          tag=f'v1.0.{run}'
          info={'versionCode':1000+run,'versionName':f'1.0.{run}','minSdk':26,'notes':'See the GitHub release notes for changes.','apkUrl':f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/releases/download/{tag}/mortal-tv.apk",'sha256':hashlib.sha256(open('mortal-tv.apk','rb').read()).hexdigest()}
          open('update.json','w').write(json.dumps(info,indent=2))
          PY
          gh release create "v1.0.${GITHUB_RUN_NUMBER}" mortal-tv.apk update.json --title "Mortal TV 1.0.${GITHUB_RUN_NUMBER}" --generate-notes --latest=false
          latest=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq '.tag_name' 2>/dev/null || true)
          latest_run=${latest##*.}
          if [[ "$latest" != v1.0.* ]] || [[ "$GITHUB_RUN_NUMBER" -gt "$latest_run" ]]; then
            gh release edit "v1.0.${GITHUB_RUN_NUMBER}" --latest
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: mortal-tv-apk
          path: |
            mortal-tv.apk
            update.json
